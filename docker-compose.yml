services:
  jobmanager:
    build:
      context: .
      dockerfile: Dockerfile
      target: flink
    container_name: crypto-jobmanager
    ports:
      - '8081:8081'
    volumes:
      - ./src:/opt/src
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager

  taskmanager:
    build:
      context: .
      dockerfile: Dockerfile
      target: flink
    container_name: crypto-taskmanager
    depends_on:
      - jobmanager
    volumes:
      - ./src:/opt/src
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4
